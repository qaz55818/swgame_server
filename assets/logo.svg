<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="踏雪笑傲">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="verm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
  </defs>

  <!-- 外圈徽章 -->
  <circle cx="64" cy="64" r="58" fill="url(#glow)" stroke="url(#ice)" stroke-width="4"/>
  <circle cx="64" cy="64" r="49" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.35"/>

  <!-- 六角雪花 -->
  <g stroke="url(#ice)" stroke-width="5.5" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="64" y1="64" x2="64" y2="28"/>
      <line x1="64" y1="39" x2="55" y2="30"/>
      <line x1="64" y1="39" x2="73" y2="30"/>
    </g>
    <use href="#arm" transform="rotate(60 64 64)"/>
    <use href="#arm" transform="rotate(120 64 64)"/>
    <use href="#arm" transform="rotate(180 64 64)"/>
    <use href="#arm" transform="rotate(240 64 64)"/>
    <use href="#arm" transform="rotate(300 64 64)"/>
  </g>

  <!-- 中心朱印 -->
  <circle cx="64" cy="64" r="8" fill="url(#verm)"/>
  <circle cx="64" cy="64" r="3.2" fill="#ffffff"/>
</svg>
